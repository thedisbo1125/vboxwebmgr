<!-- Step 1 -->
<div id='wizardCloneVMStep1' style='display: none'>

	<table class='vboxInvisible vboxVerticalTable' style='border: 0px solid transparent; border-spacing: 4px;'>
		<tr style='vertical-align: top'>
			<td colspan="2">
				<div style='padding-bottom: 2px'><span class='vboxTableLabel translate'>New machine name</span></div>
				<div class='vboxOptions' style='padding: 6px; padding-top: 8px;'>
					<input type='text' class='vboxText' name='machineCloneName' id='machineCloneNameID' style='width: calc(100% - 14px)' />
				</div>
			</td>
		</tr>
		<tr style='vertical-align: top'>
			<td style='width: 50%'>
				<div style='padding-bottom: 2px'><span class='vboxTableLabel translate'>Clone type</span></div>
				<div class='vboxOptions'>
					<table style='margin-top: 8px'>
						<tr style='vertical-align: bottom;'>
							<td><label><input type='radio' class='vboxRadio' name='vboxCloneType' value='Full' onclick='vboxCloneVMUpdateSteps(this.value)' /> <span class='translate'>Full Clone</span></label></td>
						</tr>
						<tr style='vertical-align: bottom;'>
							<td><label><input type='radio' class='vboxRadio' checked='checked' name='vboxCloneType' value='Linked' onclick='vboxCloneVMUpdateSteps(this.value)' /> <span class='translate'>Linked Clone</span></label></td>
						</tr>		
					</table>
				</div>
			</td>
			<td>
				<div style='padding-bottom: 2px'><span class='vboxTableLabel translate'>Snapshots</span></div>
				<div class='vboxOptions'>
					<table style='margin-top: 8px' class='vboxWizardCloneVMSnapshotOpts'>
						<tr style='vertical-align: bottom;'>
							<td><label><input type='radio' class='vboxRadio' checked='checked' name='vmState' value='MachineState' /> <span class='translate'>Current machine state</span></label></td>
						</tr>
						<tr style='vertical-align: bottom; display:none;' id='vboxCloneCurrentAll'>
							<td><label><input type='radio' class='vboxRadio' name='vmState' value='MachineAndChildStates' /> <span class='translate'>Current snapshot tree branch</span></label></td>
						</tr>		
						<tr style='vertical-align: bottom;'>
							<td><label><input type='radio' class='vboxRadio' name='vmState' value='AllStates' /> <span class='translate'>Everything</span></label></td>
						</tr>	
					</table>
				</div>
			</td>
		</tr>
		<tr style='vertical-align: top'>
			    <td colspan="2">
				<div style='padding-bottom: 2px'><span class='vboxTableLabel translate'>Clone Options</span></div>
				<div class='vboxOptions'>
					<table style='margin-top: 8px' class='vboxWizardCloneVMSnapshotOpts'>
						<tr>
							<th style='text-align: right; padding-top: 2px; padding-right: 6px'><span class='translate'>MAC Address Policy:</span></th>
							<td style='padding-left: 2px; '><select class="vboxselectstdbackground" name='vboxCloneMACAddressPolicy' id='vboxCloneMACAddressPolicyID' style='width: calc(100% - 6px)'>
								<option value='AllMACs' class='translate'>Include all network adapter MAC addresses</option>
								<option value='NATMACs' class='translate'>Include only NAT network adapter MAC addresses</option>
								<option value='NoMACs' class='translate' selected>Generate new MAC addresses for all network adapters</option>
							</select></td>
						</tr>
						<tr style='vertical-align: bottom; '>
							<th></th>
							<td style='padding-left: 0px; padding-top: 5px'>
								<label><input type='checkbox' class='vboxCheckbox' name='vboxCloneDiskNames' /> <span class='translate'>Keep Disk Names</span></label>
							</td>
						</tr>
						<tr style='vertical-align: bottom; '>
							<th></th>
							<td style='padding-left: 0px; padding-top: 5px'>
								<label><input type='checkbox' class='vboxCheckbox' name='vboxCloneDiskUUIDs' /> <span class='translate'>Keep Hardware UUIDs</span></label>
							</td>
						</tr>
					</table>
				</div>
			</td>
		</tr>
	</table>
</div>


<script type='text/javascript'>

$('#wizardCloneVMStep1').on('show',function(e,wiz){

	// Already initialized?
	if($('#wizardCloneVMStep1').data('init') || !wiz.args) return;
	
	$('#wizardCloneVMStep1').data('init',1);
	
	// Hold wizard
	$('#wizardCloneVMStep1').data('wiz',wiz);
	
	// Hold wizard original steps
	$('#wizardCloneVMStep1').data('wizSteps',wiz.steps);
	
	// Hide "new snapshot" message if we're cloning a snapshot
	if(wiz.args && wiz.args.snapshot)
		$('#vboxCloneVMNewSnap').hide();
	
	
	if((wiz.args.snapshot && wiz.args.snapshot.children && wiz.args.snapshot.children.length)) {
		$('#wizardCloneVMCurrentAll').show();
		$('#vboxCloneCurrentAll').show();
	}
	
	$(document.forms['frmwizardCloneVM'].elements.machineCloneName).trigger('focus');

	document.forms['frmwizardCloneVM'].elements.machineCloneName.value = trans('%1 Clone','UIWizardCloneVM').replace('%1',wiz.args.vm.name);

	var inputBox = $('#wizardCloneVMStep1').find('input.vboxText').trigger('select');
	setTimeout(inputBox.focus.bind(inputBox),10);
});


function vboxCloneVMUpdateSteps(cval) {
	
	if(cval == 'Linked') {
		$('#wizardCloneVMStep1').find('table.vboxWizardCloneVMSnapshotOpts').find('tr').addClass('disabled').find('input').prop('disabled', true);
	} else {
		$('#wizardCloneVMStep1').find('table.vboxWizardCloneVMSnapshotOpts').find('tr').removeClass('disabled').find('input').prop('disabled', false);
	}
}

</script>
